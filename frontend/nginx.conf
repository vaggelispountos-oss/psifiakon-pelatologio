# frontend/nginx.conf
# --------------------------------------------------------------------
# Σερβίρει το Vite build + κάνει proxy το /api στο backend.
# Ο ρόλος του είναι ίδιος με του Vercel σε production (δες vercel.json για
# τα rewrites/headers που αντιγράφονται εδώ), με τη διαφορά ότι εδώ backend
# και frontend είναι στο ΙΔΙΟ origin.
# --------------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Το bundle περιέχει tesseract.js (αρκετά MB) — χωρίς gzip το πρώτο
    # φόρτωμα σε κινητό με 4G είναι αισθητά αργό.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
               application/wasm image/svg+xml;

    # ---- API proxy ----
    # Ο browser μιλά ΜΟΝΟ σε αυτό το origin, οπότε δεν χτυπιέται ποτέ CORS
    # (ίδια λογική με τον Vite proxy στο vite.config.js για τοπική ανάπτυξη).
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ProxyFix στο backend (x_for=1) διαβάζει ΑΥΤΟ το header για να βρει
        # την πραγματική IP του χρήστη — χωρίς του, το per-IP rate limiting
        # στο /api/auth/* θα μετρούσε ΟΛΟΥΣ τους χρήστες σαν έναν.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Μία κλήση προς ΑΑΔΕ φτάνει έως ~60s (real_aade.py: 30s timeout × 2
        # retries) και ο gunicorn την αφήνει έως 120s. Το nginx ΠΡΕΠΕΙ να
        # περιμένει περισσότερο, αλλιώς κόβει με 504 μια κλήση που ίσως μόλις
        # πέτυχε στην ΑΑΔΕ — ακριβώς η "indeterminate" κατάσταση που
        # προσπαθεί να αποφύγει το real_aade._post_xml.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Ταιριάζει με το MAX_CONTENT_LENGTH (8MB) του config.py — αλλιώς το
        # nginx θα έκοβε τα uploads φωτογραφιών στο /api/ocr/plate με 413
        # πριν καν φτάσουν στο Flask.
        client_max_body_size 8m;
    }

    # ---- Cache headers (ίδια με το vercel.json) ----
    # Χωρίς αυτά ο browser κρατά παλιό service worker και ο χρήστης κολλάει
    # σε παλιά έκδοση της εφαρμογής ακόμα κι after deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Τα assets του Vite έχουν hash στο όνομα -> ασφαλές να μείνουν για πάντα.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- SPA fallback ----
    # Ίδιο με το rewrite του vercel.json. Χωρίς αυτό, refresh (ή απευθείας
    # άνοιγμα link από email) σε /reset-password?token=... ή /verify-email
    # γυρνά 404, γιατί δεν υπάρχει τέτοιο αρχείο στον δίσκο.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
