services:
  - type: web
    name: dcl-backend
    runtime: python
    plan: free
    rootDir: backend
    # `alembic upgrade head` τρέχει ΕΔΩ (build step — ΜΙΑ φορά, πριν
    # ξεκινήσει κανένας gunicorn worker), ΟΧΙ μέσα στο app.py. Το build
    # τρέχει με τα ίδια envVars του service, άρα βλέπει το πραγματικό
    # DATABASE_URL. Σχήμα βάσης = αποκλειστική ευθύνη του Alembic πλέον
    # (δες backend/migrations/) — το app.py δεν κάνει καμία αλλαγή σχήματος
    # στο boot (δες app.create_app).
    #
    # (Αν αναβαθμιστεί το plan και προτιμηθεί `preDeployCommand` αντί για
    # chaining εδώ, λειτουργικά είναι το ίδιο — και τα δύο τρέχουν μία φορά,
    # πριν οι workers δεχτούν κίνηση.)
    # `scripts/migrate.py` αντί για σκέτο `alembic upgrade head`: ελέγχει
    # μόνο του αν η βάση είναι σε "legacy" κατάσταση (πίνακες ήδη υπάρχουν
    # από το παλιό db.create_all(), αλλά ΔΕΝ υπάρχει alembic_version) και
    # κάνει stamp στο baseline ΠΡΙΝ το upgrade — αλλιώς ίδιο με σκέτο
    # upgrade head. Self-healing: δεν χρειάζεται ΠΟΤΕ χειροκίνητο toggle
    # stamp/upgrade ξανά (είχαμε ήδη μπερδευτεί μία φορά με αυτό — δες
    # migrations/README ή backend/scripts/migrate.py για το πλήρες ιστορικό).
    buildCommand: pip install -r requirements.txt && python scripts/migrate.py
    # --workers 2 --threads 4: με ΕΝΑΝ sync worker (το προηγούμενο default),
    # ΜΙΑ κλήση προς την ΑΑΔΕ (έως ~60s: 30s timeout × 2 retries — δες
    # real_aade.py) μπλόκαρε ΟΛΟΥΣ τους υπόλοιπους χρήστες ταυτόχρονα.
    # Threads (όχι processes) γιατί το bottleneck είναι δικτυακή αναμονή
    # (I/O προς ΑΑΔΕ), όχι CPU — φθηνότερο σε μνήμη στο free plan.
    # --timeout 120: πρέπει να είναι ΜΕΓΑΛΥΤΕΡΟ από το χειρότερο σενάριο
    # της ΑΑΔΕ (60s), αλλιώς ο gunicorn σκοτώνει τον worker ΜΕΣΑ σε μια
    # κλήση που ίσως μόλις πέτυχε στην ΑΑΔΕ (ακριβώς η κατάσταση που
    # χειρίζεται το real_aade._post_xml ως indeterminate).
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120 --graceful-timeout 30
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dcl-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      # sync: false ώστε μια χειροκίνητη αλλαγή στο Render dashboard (π.χ. για
      # πρώτο πραγματικό τεστ ΑΑΔΕ) να ΜΗΝ επανέρχεται σε "true" σε κάθε
      # redeploy από αυτό το blueprint. Χωρίς τιμή, το config.py κάνει
      # default σε "true" (mock) — ασφαλές fallback.
      - key: USE_MOCK_AADE
        sync: false
      # Βάλε εδώ το πραγματικό origin του Vercel frontend μετά το πρώτο
      # deploy (π.χ. https://dcl-frontend.vercel.app) — μέχρι τότε δεν
      # μπλοκάρει τίποτα (Flask-CORS default "*" αν μείνει κενό).
      - key: CORS_ORIGINS
        sync: false
      # Βάλε το πραγματικό Resend API key όταν είναι έτοιμο (χωρίς αυτό, το
      # forgot-password απλά καταγράφει το link στα logs αντί να στέλνει
      # email — δες backend/email_service.py).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Origin του production frontend — χρησιμοποιείται στο link επαναφοράς
      # κωδικού μέσα στο email (π.χ. https://app.mygarage.gr).
      - key: FRONTEND_URL
        sync: false

databases:
  - name: dcl-db
    plan: free
